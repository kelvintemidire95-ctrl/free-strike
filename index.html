<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Strike</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#07131dcc;border:1px solid #ffffff30;border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px)}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}#stats{font-weight:bold;line-height:1.7}#status{text-align:center;max-width:48%;font-weight:bold}#healthbar{width:150px;height:9px;background:#555;border-radius:9px;overflow:hidden;margin-top:5px}#health{height:100%;width:100%;background:#38df75}#bottom{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}#weapon{font-size:14px;font-weight:bold}#controls{position:absolute;bottom:22px;right:20px;display:flex;gap:12px;align-items:end;pointer-events:auto}.ctrl{width:66px;height:66px;border-radius:50%;border:2px solid #ffffff88;background:#07131d99;color:white;font-weight:bold;font-size:12px;touch-action:none}.ctrl:active{background:#e6a52b}.move{position:absolute;bottom:24px;left:24px;width:125px;height:125px;border-radius:50%;border:2px solid #ffffff55;background:#07131d66;pointer-events:auto;touch-action:none}.stick{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffff99}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07131dcc,#07131dee);z-index:5;padding:20px}#card{width:min(440px,100%);text-align:center;background:#102536;border:1px solid #ffffff33;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0009}h1{font-size:42px;letter-spacing:3px;margin:0 0 8px;color:#ffbd39}#card p{color:#d3e1e9;line-height:1.5}input{width:100%;padding:13px;border-radius:8px;border:1px solid #789;background:#07131d;color:white;margin:10px 0}button.primary{padding:14px 24px;border:0;border-radius:9px;background:#ffb52e;color:#18212a;font-weight:900;font-size:16px;width:100%;margin-top:8px}#hint{font-size:12px;color:#b8c8d1}#error{color:#ff8e8e;min-height:18px;font-size:13px}
@media(min-width:800px){.move{display:none}#controls{right:28px;bottom:26px}.ctrl{width:74px;height:74px}}
</style>
</head>
<body><div id="game"></div><div id="hud">
<div id="top"><div class="panel" id="stats">PLAYERS: <span id="players">0</span><br>ALIVE: <span id="alive">0</span><div id="healthbar"><div id="health"></div></div></div><div class="panel" id="status">WAITING FOR PLAYERS</div><div class="panel" id="timer">00:00</div></div>
<div id="bottom"><div class="panel" id="weapon">RIFLE · <span id="ammo">30</span>/120</div><div class="panel">WASD move · Mouse aim · Click fire</div></div>
<div class="move" id="movePad"><div class="stick" id="stick"></div></div><div id="controls"><button class="ctrl" id="reload">RELOAD</button><button class="ctrl" id="fire">FIRE</button></div></div>
<div id="overlay"><div id="card"><h1>FREE STRIKE</h1><p>ONLINE BATTLE ROYALE<br>Drop in. Gear up. Be the last player standing.</p><input id="nickname" maxlength="16" placeholder="Enter your player name" value="Player"><button class="primary" id="play">JOIN MATCH</button><p id="hint">Up to 10 players · Solo mode · Early online test build</p><div id="error"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);let scene,camera,renderer,me=null,socket=null,players={},keys={},yaw=0,pitch=-.18,ammo=30,health=100,started=false,lastShot=0,zoneRadius=105,gameStart=0,moveTouch={x:0,y:0};
const mats={ground:null};
function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc4d8);scene.fog=new THREE.Fog(0x8bc4d8,110,300);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd9f3ff,0x51633d,2));let sun=new THREE.DirectionalLight(0xffedc4,2.2);sun.position.set(70,100,30);sun.castShadow=true;scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x63834a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// island shoreline and varied terrain props
let water=new THREE.Mesh(new THREE.CircleGeometry(212,64),new THREE.MeshStandardMaterial({color:0x287f9a,roughness:.5}));water.rotation.x=-Math.PI/2;water.position.y=-2.2;scene.add(water);
for(let i=0;i<38;i++){let x=(Math.random()-.5)*230,z=(Math.random()-.5)*230;if(Math.hypot(x,z)>125)continue;let h=2+Math.random()*7,w=3+Math.random()*7;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshStandardMaterial({color:[0x9b8767,0x777d78,0xb0a184][i%3]}));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);let roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.5,.7,w+0.5),new THREE.MeshStandardMaterial({color:0x604a39}));roof.position.set(x,h+.25,z);scene.add(roof)}
for(let i=0;i<95;i++){let a=Math.random()*Math.PI*2,r=18+Math.random()*112,x=Math.cos(a)*r,z=Math.sin(a)*r;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,3,6),new THREE.MeshStandardMaterial({color:0x59402b}));trunk.position.set(x,1.5,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,7),new THREE.MeshStandardMaterial({color:0x285c36}));crown.position.set(x,5,z);scene.add(crown)}
let grid=new THREE.GridHelper(300,60,0x78916a,0x78916a);grid.position.y=.03;grid.material.transparent=true;grid.material.opacity=.12;scene.add(grid);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate()}
function makePlayer(color=0x2878d0){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.05,4,8),new THREE.MeshStandardMaterial({color}));body.position.y=1.15;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),new THREE.MeshStandardMaterial({color:0xd5a47c}));head.position.y=2.05;g.add(head);let gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.16,1.15),new THREE.MeshStandardMaterial({color:0x20252a,metalness:.6}));gun.position.set(.45,1.35,-.35);g.add(gun);scene.add(g);return g}
function connect(){let params=new URLSearchParams(location.search);let server=(params.get('server')||'https://free-strike-online.onrender.com').trim().replace(/\/$/,'');socket=io(server,{transports:['websocket','polling'],timeout:12000,reconnection:true,reconnectionAttempts:8});socket.on('connect',()=>{socket.emit('join',{name:$('nickname').value.trim()||'Player'});$('error').textContent=''});socket.on('connect_error',()=>{$('error').textContent='Cannot reach the match server. Make sure the Render Web Service is live.'});socket.on('full',()=>{$('error').textContent='This match is full. Try again later.'});socket.on('disconnect',()=>{if(started)$('status').textContent='RECONNECTING TO SERVER…'});socket.on('state',s=>{if(!started)return;let alive=0;Object.values(s.players).forEach(p=>{if(p.alive)alive++;if(p.id===socket.id){me=p;health=p.health;$('health').style.width=health+'%';if(!players[p.id])players[p.id]=makePlayer(0x277bd2);let own=players[p.id];own.visible=p.alive;own.position.set(p.x,0,p.z);own.rotation.y=p.rot||0;return}if(!players[p.id])players[p.id]=makePlayer(0xc77c35);let m=players[p.id];m.visible=p.alive;m.position.set(p.x,0,p.z);m.rotation.y=p.rot||0});for(let id in players)if(!s.players[id]){scene.remove(players[id]);delete players[id]}$('players').textContent=Object.keys(s.players).length;$('alive').textContent=alive;zoneRadius=s.zoneRadius;$('status').textContent=s.phase==='waiting'?'WAITING FOR PLAYERS':s.phase==='playing'?'SAFE ZONE SHRINKING':'MATCH FINISHED';if(s.phase==='finished'&&me&&me.alive)$('status').textContent='VICTORY!'});socket.on('joined',p=>{me=p;if(!players[socket.id])players[socket.id]=makePlayer(0x277bd2);players[socket.id].position.set(p.x,0,p.z)});socket.on('damage',d=>{if(d.target===socket.id){health=d.health;$('health').style.width=health+'%'}});socket.on('matchEnd',d=>{$('status').textContent=d.winner===socket.id?'BOOYAH! YOU WIN':'MATCH OVER'});}
function start(){if(started)return;if(!window.THREE||!window.io){$('error').textContent='Game libraries failed to load. Refresh and try again.';return}started=true;$('overlay').style.display='none';if(!scene)init3D();connect();gameStart=Date.now();setInterval(()=>{if(started)$('timer').textContent=new Date(Date.now()-gameStart).toISOString().substr(14,5)},1000)}
function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=.016;if(me&&socket&&socket.connected){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);f-=moveTouch.y;s+=moveTouch.x;let len=Math.hypot(f,s);if(len>1){f/=len;s/=len}let dx=(Math.sin(yaw)*f+Math.cos(yaw)*s)*.22,dz=(-Math.cos(yaw)*f+Math.sin(yaw)*s)*.22;if(Math.abs(dx)+Math.abs(dz)>.001){me.x=Math.max(-145,Math.min(145,me.x+dx));me.z=Math.max(-145,Math.min(145,me.z+dz));socket.emit('move',{x:me.x,z:me.z,rot:yaw})}let target=new THREE.Vector3(me.x,0,me.z);camera.position.set(me.x+Math.sin(yaw)*7,4.2,me.z+Math.cos(yaw)*7);camera.lookAt(target.x,1.3,target.z)}renderer.render(scene,camera)}
function shoot(){if(!started||!socket||ammo<=0||Date.now()-lastShot<180)return;lastShot=Date.now();ammo--;$('ammo').textContent=ammo;socket.emit('shoot',{yaw,pitch})}function reload(){if(ammo<30){ammo=30;$('ammo').textContent=ammo}}
$('play').onclick=start;$('fire').ontouchstart=e=>{e.preventDefault();shoot()};$('fire').onclick=shoot;$('reload').onclick=reload;window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});window.addEventListener('keyup',e=>keys[e.code]=false);rendererMouse();function rendererMouse(){document.addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.0025;pitch=Math.max(-.8,Math.min(.5,pitch-e.movementY*.002))}});document.addEventListener('click',e=>{if(started&&e.target===renderer?.domElement){renderer.domElement.requestPointerLock?.();shoot()}})}
let pad=$('movePad'),stick=$('stick');function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,mag=Math.min(42,Math.hypot(x,y)),a=Math.atan2(y,x);moveTouch.x=Math.cos(a)*mag/42;moveTouch.y=Math.sin(a)*mag/42;stick.style.transform=`translate(${moveTouch.x*35}px,${moveTouch.y*35}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)padMove(e)});pad.addEventListener('pointerup',()=>{moveTouch={x:0,y:0};stick.style.transform=''});init3D();
})();
</script></body></html>
